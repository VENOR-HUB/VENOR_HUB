<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VENOR HUB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #101116;
      color: white;
      font-family: Arial, sans-serif;
      padding: 22px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .ai {
      color: #f0c44e;
      font-size: 14px;
    }

    .hero {
      margin-top: 55px;
      text-align: center;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .hero span {
      color: #f0c44e;
    }

    .hero p {
      color: #b5b4bd;
      line-height: 1.6;
    }

    .search {
      margin: 28px 0;
    }

    .search input {
      width: 100%;
      padding: 17px;
      border-radius: 12px;
      border: 1px solid #393741;
      background: #222127;
      color: white;
      font-size: 16px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .category {
      background: #222127;
      border: 1px solid #393741;
      border-radius: 14px;
      padding: 22px 12px;
      text-align: center;
    }

    .category h3 {
      margin-bottom: 8px;
    }

    .category p {
      color: #aaa8b2;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #888691;
      margin-top: 50px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">VENOR</div>
    <div class="ai">✦ Venor AI</div>
  </header>

  <section class="hero">
    <h1>Discover <span>Anything.</span></h1>
    <p>
      Tafuta bidhaa, huduma na biashara
      kwa urahisi kupitia Venor Hub.
    </p>
  </section>

  <div class="search">
    <input
      type="search"
      placeholder="Unatafuta nini leo?"
    >
  </div>

  <section class="categories">

    <div class="category">
      <h3>Marketplace</h3>
      <p>Nunua na uza</p>
    </div>

    <div class="category">
      <h3>Products</h3>
      <p>Gundua bidhaa</p>
    </div>

    <div class="category">
      <h3>Images</h3>
      <p>Tafuta picha</p>
    </div>

    <div class="category">
      <h3>Videos</h3>
      <p>Gundua video</p>
    </div>

  </section>

  <div class="footer">
    VENOR HUB · Digital Discovery Platform
  </div>

</body>
</html>
